[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpc-mcts-evrp"
version = "0.1.0"
description = "Event-triggered MPC with fleet optimizers for dynamic EVRPTW"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=results/.pytest_work"

[project.scripts]
evrp = "evrp.cli:main"

[tool.setuptools.packages.find]
include = ["evrp*"]
